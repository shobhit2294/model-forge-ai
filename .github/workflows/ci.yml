name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build application image
        run: docker build -t ai-engineering-agent:ci .
      - name: Run tests in image
        run: docker run --rm -v "$PWD:/service" -w /service ai-engineering-agent:ci python -m pytest -q